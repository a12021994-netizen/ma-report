:root{

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'IBM Plex Sans TC', system-ui, sans-serif;

}
.wrap{max-width:1240px;margin:0 auto;}

.hero{

  border-bottom:1px solid var(--border);
}
.hero .eyebrow{

  font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--accent);
}
.hero h1{
  font-size:26px; font-weight:700; margin:2px 0 4px;
  letter-spacing:-.01em;
}
.hero p{
  margin:0; color:var(--text-dim); font-size:13.5px; line-height:1.6;
}

.bench-row{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:30px;}

.bench-card{
  background:var(--bg-panel);
  border:1px solid var(--border);
  border-radius:10px;
  padding:16px 18px;
}
.bench-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:2px;}
.bench-name{font-size:14px; font-weight:600;}
.bench-date-row{font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--text-faint); margin-bottom:10px;}
.chart-link{

  border:1px solid rgba(91,141,239,.4); border-radius:20px; padding:3px 9px;
  white-space:nowrap;
}
.chart-link:hover{background:rgba(91,141,239,.12);}
.bench-price{
  font-family:'IBM Plex Mono',monospace; font-size:24px; font-weight:600;
  margin-bottom:12px;
}
.bench-price .sub{font-size:12px; color:var(--text-dim); font-weight:400; margin-left:8px;}

.ladder{display:flex; gap:6px; margin-bottom:10px;}
.dot-wrap{flex:1; text-align:center;}
.dot-label{font-size:9.5px; color:var(--text-faint); margin-bottom:4px; font-family:'IBM Plex Mono',monospace;}
.dot{
  width:100%; padding:5px 2px; border-radius:6px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
}
.dot.above{background:var(--strong-bg); color:var(--strong); border:1px solid rgba(226,87,76,.35);}
.dot.below{background:var(--weak-bg); color:var(--weak); border:1px solid rgba(63,174,114,.35);}
.dot-arrow{font-size:10px; line-height:1;}
.dot-val{font-family:'IBM Plex Mono',monospace; font-size:9.5px; font-weight:600; line-height:1.2; white-space:nowrap;}

.bench-foot{
  display:flex; justify-content:space-between;
  font-size:11.5px; color:var(--text-dim);
  padding-top:10px; border-top:1px dashed var(--border);
}
.bench-foot b{color:var(--text); font-family:'IBM Plex Mono',monospace;}

.group-card{
  background:var(--bg-panel);
  border:1px solid var(--border);
  border-radius:10px;
  margin-bottom:22px;
  overflow:hidden;
  scroll-margin-top:16px;
}
.group-head{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 18px; border-bottom:1px solid var(--border);
  background:var(--bg-panel-2);
}
.group-head h2{font-size:15px; font-weight:600; margin:0;}
.group-head-right{display:flex; align-items:center; gap:10px;}
.group-head .count{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text-dim);}

.group-trend{
  padding:14px 18px 16px;
  border-top:1px solid var(--border);
}
.trend-chart{width:100%; height:150px; display:block;}
.trend-title{font-size:11px; color:var(--text-dim); margin-bottom:6px; letter-spacing:.03em;}
.trend-empty{
  font-size:11px; color:var(--text-faint); text-align:center; padding:20px 0;
}

.table-scroll{overflow-x:auto;}
table{border-collapse:collapse; width:100%; min-width:640px; table-layout:fixed; font-size:11px;}
thead th{
  position:sticky; top:0;
  background:var(--bg-panel-2);
  color:var(--text-dim);
  font-weight:600; font-size:9.5px; letter-spacing:.01em;

thead th.col-num{width:10.3%;}
thead th.col-cnt{width:8%;}
tbody td{

  border-bottom:1px solid var(--border);
  font-family:'IBM Plex Mono',monospace;
}
tbody td.left{text-align:left; font-family:'IBM Plex Sans TC',sans-serif; padding-left:8px;}
tbody tr:hover{background:rgba(255,255,255,0.02);}

td.code{color:var(--text-dim); white-space:nowrap; font-size:10.5px;}
td.name{font-weight:600; white-space:nowrap; font-size:11.5px;}
.stock-link{color:var(--text); text-decoration:none; border-bottom:1px dashed var(--text-faint);}
.stock-link:hover{color:var(--accent); border-bottom-color:var(--accent);}
.date-tag{font-size:8.5px; color:var(--text-faint); margin-top:2px; font-family:'IBM Plex Mono',monospace;}

.data-cell{
  width:100%; max-width:58px; margin:0 auto; background:#0f1216; border:1px solid var(--border);
  color:var(--text); border-radius:4px; padding:4px 2px;
  font-family:'IBM Plex Mono',monospace; font-size:10.5px; text-align:center;
}
.data-cell.above{background:var(--strong-bg); border-color:rgba(226,87,76,.4); color:var(--strong); font-weight:600;}
.data-cell.below{background:var(--weak-bg); border-color:rgba(63,174,114,.4); color:var(--weak); font-weight:600;}

.count-badge{

  font-weight:700; font-size:10.5px; font-family:'IBM Plex Mono',monospace;
}
.badge-yn{
  font-size:9.5px; font-weight:600; padding:2px 5px; border-radius:20px;
  font-family:'IBM Plex Sans TC',sans-serif; white-space:nowrap;
}
.badge-yes{background:var(--signal-bg); color:var(--signal);}
.badge-no{background:transparent; color:var(--text-faint);}

.group-summary{

}
.summary-title{font-size:11px; color:var(--text-dim); margin-bottom:10px; letter-spacing:.03em;}

.overview-bar{height:100%; border-radius:6px; transition:width .2s;}
.overview-pct{

.overview-diverge{

.dist-track::before{

.dist-dot{
  position:absolute; top:50%; width:7px; height:7px; margin:-3.5px 0 0 -3.5px;

.dist-avg{

}
.dist-legend{

.dist-legend span{display:inline-flex; align-items:center; gap:5px;}

.data-source-note{

}

  .overview-name{font-size:12px;}
  .overview-pct{width:44px; font-size:11px;}
  .diverge-slot{display:none;}
  .dist-axis{margin-right:54px;}
}
</style>

// ---------- 計算邏輯 ----------
function isAbove(close, ma){
  if(!isFinite(close) || !isFinite(ma) || close<=0 || ma<=0) return null;
  return close > ma;
}
function countAbove(close, maMap){
  let n=0, total=0;
  MA_PERIODS.forEach(p=>{
    const r = isAbove(close, maMap[p]);
    if(r!==null){ total++; if(r) n++; }
  });
  return {n, total};
}

// ---------- 大盤基準渲染 ----------
function renderBenchmarks(){
  const root = document.getElementById('benchRow');
  root.innerHTML = benchmarks.map(b=>{
    const dots = MA_PERIODS.map(p=>{
      const above = isAbove(b.close, b.ma[p]);
      const maVal = (b.ma[p]===null || b.ma[p]===undefined) ? null : b.ma[p];
      return `<div class="dot-wrap">
        <div class="dot-label">MA${p}</div>
        <div class="dot ${above?'above':above===false?'below':''}">
          <div class="dot-arrow">${above===null?'–':(above? '▲':'▼')}</div>
          <div class="dot-val">${maVal===null?'–':maVal.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}</div>
        </div>
      </div>`;
    }).join('');
    const cnt = countAbove(b.close, b.ma);
    return `<div class="bench-card">
      <div class="bench-top">
        <div class="bench-name">${b.name}</div>
        <a class="chart-link" href="${b.chartUrl}" target="_blank" rel="noopener">K線圖 ↗</a>
      </div>
      <div class="bench-date-row">${b.date}</div>
      <div class="bench-price">${b.close===null?'–':b.close.toLocaleString()}<span class="sub">站上 ${cnt.n}/${cnt.total} 條均線</span></div>
      <div class="ladder">${dots}</div>
    </div>`;
  }).join('');
}

const state = {};
groups.forEach(g=> g.stocks.forEach(s=>{
  state[s.code] = {
    close: s.close ?? '', high: s.high ?? '',
    ma5: s.ma5 ?? '', ma10: s.ma10 ?? '', ma20: s.ma20 ?? '', ma60: s.ma60 ?? '',
    ma120: s.ma120 ?? '', ma240: s.ma240 ?? '', high52w: s.high52w ?? ''
  };
}));

function num(v){
  const n = parseFloat(v);
  return isFinite(n) ? n : NaN;
}

function computeRow(code){
  const d = state[code];
  const close = num(d.close);
  const high52w = num(d.high52w);
  const maMap = {5:num(d.ma5),10:num(d.ma10),20:num(d.ma20),60:num(d.ma60),120:num(d.ma120),240:num(d.ma240)};
  const cnt = countAbove(close, maMap);
  const distPct = (isFinite(close) && isFinite(high52w) && high52w>0)
    ? Math.round((close/high52w*100-100)*10)/10
    : null;
  return {close, maMap, cnt, distPct};
}

function displayCell(value, opts={}){
  const cls = ['data-cell'];
  if(opts.above===true) cls.push('above');
  if(opts.above===false) cls.push('below');
  const v = (value===''||value===undefined||value===null) ? '–' : value;
  return `<div class="${cls.join(' ')}">${v}</div>`;
}

function renderGroupTrendChart(history, opts={}){
  if(!history || history.length < 2){
    return `<div class="trend-empty">${opts.emptyText || '趨勢圖累積中 — 需要至少 2 天的每日紀錄才會顯示'}</div>`;
  }
  const yMin = opts.yMin ?? 0, yMax = opts.yMax ?? 100;
  const ticks = opts.ticks || [0,25,50,75,100];
  const w = 600, h = 160;
  const padL = 44, padR = 22, padT = 16, padB = 26;
  const chartW = w - padL - padR;
  const chartH = h - padT - padB;
  const n = history.length;
  const yFor = pct => padT + chartH - ((pct-yMin)/(yMax-yMin))*chartH;
  const xFor = i => padL + (n===1 ? 0 : (i/(n-1))*chartW);

  const gridLines = ticks.map(v=>{
    const y = yFor(v);
    return `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${w-padR}" y2="${y.toFixed(1)}" stroke="var(--border)" stroke-width="1"/>
      <text x="${padL-6}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--text-faint)" font-family="'IBM Plex Mono',monospace">${v}%</text>`;
  }).join('');

  const points = history.map((d,i)=>({x:xFor(i), y:yFor(d.pct), date:d.date, pct:d.pct}));
  const pointsStr = points.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');

  const first = history[0].pct, last = history[history.length-1].pct;
  const trendUp = last >= first;
  const color = trendUp ? 'var(--strong)' : 'var(--weak)';

  const xLabels = points.map(p=>
    `<text x="${p.x.toFixed(1)}" y="${h-6}" text-anchor="middle" font-size="9" fill="var(--text-faint)" font-family="'IBM Plex Mono',monospace">${p.date}</text>`
  ).join('');

  const dots = points.map(p=>
    `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3" fill="${color}"><title>${p.date}: ${p.pct}%</title></circle>`
  ).join('');

  const valueLabels = points.map(p=>
    `<text x="${p.x.toFixed(1)}" y="${(p.y-8).toFixed(1)}" text-anchor="middle" font-size="9" font-weight="600" fill="${color}" font-family="'IBM Plex Mono',monospace">${p.pct}%</text>`
  ).join('');

  return `<svg class="trend-chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    ${gridLines}
    <polyline points="${pointsStr}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}
    ${valueLabels}
    ${xLabels}
  </svg>`;
}

function renderGroups(){
  const root = document.getElementById('groupsRoot');
  root.innerHTML = groups.map(g=>{
    const rows = g.stocks.map(s=>{
      const r = computeRow(s.code);
      const cntColor = r.cnt.total===0 ? 'var(--text-faint)' : (r.cnt.n>=4?'var(--strong)': r.cnt.n<=2?'var(--weak)':'var(--signal)');
      const chartUrl = `https://www.wantgoo.com/stock/${s.code}/technical-chart`;
      return `<tr>
        <td class="left code">${s.code}</td>
        <td class="left name"><a class="stock-link" href="${chartUrl}" target="_blank" rel="noopener" title="開啟 ${s.name} K線圖">${s.name}</a></td>
        <td>
          ${displayCell(state[s.code].close)}
          <div class="date-tag">${s.date||''}</div>
        </td>
        <td>${displayCell(state[s.code].high)}</td>
        <td>${displayCell(state[s.code].high52w)}</td>
        <td>${displayCell(r.distPct===null ? '' : (r.distPct>0?'+':'')+r.distPct+'%')}</td>
        ${MA_PERIODS.map(p=>`<td>${displayCell(state[s.code]['ma'+p],{above:isAbove(r.close,r.maMap[p])})}</td>`).join('')}
        <td><span class="count-badge" style="color:${cntColor}">${r.cnt.total? r.cnt.n+'/'+r.cnt.total : '–'}</span></td>
      </tr>`;
    }).join('');

    return `<div class="group-card" id="grp-${g.name}" data-group="${g.name}">
      <div class="group-head">
        <h2>${g.name}</h2>
        <div class="group-head-right">
          <div class="count">${g.stocks.length} 檔成分股</div>

      </div>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th class="left col-code">代號</th><th class="left col-name">名稱</th>
              <th class="col-num">收盤價</th><th class="col-num">盤中<br/>最高</th>
              <th class="col-num">52週<br/>高點</th><th class="col-num">離高點<br/>%</th>
              ${MA_PERIODS.map(p=>`<th class="col-num">MA${p}</th>`).join('')}

            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div class="group-summary" data-summary="${g.name}"></div>
      <div class="group-trend">
        <div class="trend-title">站上均線比例趨勢</div>
        ${renderGroupTrendChart(g.history)}
      </div>
      <div class="group-trend">
        <div class="trend-title">族群平均離52週高點% 趨勢</div>
        ${renderDistTrendChart(g.distHistory)}
      </div>
    </div>`;
  }).join('');

  renderSummaries();
}

function renderSummaries(){
  groups.forEach(g=>{
    const el = document.querySelector(`[data-summary="${g.name}"]`);
    const cells = MA_PERIODS.map(p=>{
      let above=0, total=0;
      g.stocks.forEach(s=>{
        const close = num(state[s.code].close);
        const ma = num(state[s.code]['ma'+p]);
        const r = isAbove(close, ma);
        if(r!==null){ total++; if(r) above++; }
      });
      const pct = total? Math.round(above/total*100) : null;
      const benchBelow = benchmarks.filter(b=> isAbove(b.close,b.ma[p])===false).map(b=>b.name.split(' ')[0]);
      const diverge = pct!==null && pct>=70 && benchBelow.length>0;
      return `<div class="summary-cell ${diverge?'diverge':''}">
        <div class="period">MA${p}</div>
        <div class="pct" style="color:${pct===null?'var(--text-faint)': diverge?'var(--signal)':(pct>=70?'var(--strong)':pct<=30?'var(--weak)':'var(--text)')}">${pct===null?'–':pct+'%'}</div>
        <div class="count-sub">${total? above+'/'+total+' 家' : ''}</div>
        <div class="flag">${diverge? '族群強於 '+benchBelow.join('/') : ''}</div>
      </div>`;
    }).join('');
    el.innerHTML = `<div class="summary-title">族群站上各均線比例(%)　—　與大盤同期均線位置比對</div>
      <div class="summary-grid">${cells}</div>`;
  });
}

function groupStats(g){
  let sumPct = 0, periodsCounted = 0, divergeCount = 0;
  MA_PERIODS.forEach(p=>{
    let above=0, total=0;
    g.stocks.forEach(s=>{
      const close = num(state[s.code].close);
      const ma = num(state[s.code]['ma'+p]);
      const r = isAbove(close, ma);
      if(r!==null){ total++; if(r) above++; }
    });
    if(total){
      const pct = above/total*100;
      sumPct += pct; periodsCounted++;
      const benchBelow = benchmarks.some(b=> isAbove(b.close,b.ma[p])===false);
      if(pct>=70 && benchBelow) divergeCount++;
    }
  });
  const avgPct = periodsCounted? sumPct/periodsCounted : null;
  return {avgPct, divergeCount};
}

function renderOverview(){
  const root = document.getElementById('overviewRoot');
  const ranked = groups.map(g=>({name:g.name, ...groupStats(g), dist:groupDistStats(g)}))
    .sort((a,b)=> (b.avgPct??-1) - (a.avgPct??-1));
  const axisMin = distAxisMin(ranked.flatMap(r=>r.dist.vals));
  const xPct = v => ((v-axisMin)/(0-axisMin)*100).toFixed(2);

  const rows = ranked.map((r, i)=>{
    const pct = r.avgPct===null ? 0 : Math.round(r.avgPct);
    const color = pct>=70 ? 'var(--strong)' : pct<=30 ? 'var(--weak)' : 'var(--signal)';
    const dColor = distColor(r.dist.avg);
    const dots = r.dist.vals.map(v=>`<div class="dist-dot" style="left:${xPct(v)}%" title="${fmtDist(v)}"></div>`).join('');
    const avgDot = r.dist.avg===null ? '' :
      `<div class="dist-avg" style="left:${xPct(r.dist.avg)}%; background:${dColor};" title="族群平均 ${fmtDist(r.dist.avg)}"></div>`;
    return `<div class="overview-row">
      <div class="overview-rank">${i+1}</div>
      <div class="overview-name"><a class="overview-link" href="#grp-${r.name}">${r.name}</a></div>
      <div class="overview-panels">
        <div class="overview-panel">
          <div class="overview-barwrap"><div class="overview-bar" style="width:${pct}%; background:${color};"></div></div>
          <div class="overview-pct" style="color:${color};">${r.avgPct===null?'–':pct+'%'}</div>
          <div class="diverge-slot">${r.divergeCount>0 ? `<span class="overview-diverge">${r.divergeCount}項強於大盤</span>` : ''}</div>
        </div>
        <div class="overview-panel">
          <div class="dist-track">${dots}${avgDot}</div>
          <div class="overview-pct" style="color:${dColor};">${fmtDist(r.dist.avg)}</div>
        </div>
      </div>
    </div>`;
  });

  root.innerHTML = `<div class="overview-card" id="overviewCard">
    <div class="overview-title">族群總覽 — 依站上均線平均比例排序</div>
    <div class="overview-sub">左:族群在6條均線(5/10/20/60/120/240日)上站上比例的平均值,越高代表多頭排列越完整。右:離52週高點%,大圓點為族群平均、小灰點為各成分股,越靠右越接近高點</div>
    <div class="overview-head">
      <div></div><div></div>
      <div class="overview-panels">
        <div class="overview-panel"><div class="overview-col-title">站上均線平均比例</div></div>
        <div class="overview-panel">
          <div class="overview-col-title">離52週高點%</div>
          <div class="dist-axis"><span>${axisMin}%</span><span>${Math.round(axisMin/2)}%</span><span>0%</span></div>
        </div>
      </div>
    </div>
    ${collapsibleRows(rows, 'overviewCard')}
    <div class="dist-legend">
      <span>離高點:</span>
      <span><i style="width:10px;height:10px;background:var(--strong)"></i>≥ -10%</span>
      <span><i style="width:10px;height:10px;background:var(--signal)"></i>-10% ~ -25%</span>
      <span><i style="width:10px;height:10px;background:var(--weak)"></i>≤ -25%</span>
      <span><i style="width:7px;height:7px;background:var(--text-faint)"></i>個股</span>
    </div>
  </div>`;
  bindOverviewToggle('overviewCard');
}

// ---------- 總覽共用：預設只顯示前 N 名，其餘可展開 ----------
const OVERVIEW_TOP_N = 10;
function collapsibleRows(rows, cardId){
  const hiddenCount = Math.max(rows.length - OVERVIEW_TOP_N, 0);
  const moreRows = hiddenCount
    ? `<div class="overview-more">${rows.slice(OVERVIEW_TOP_N).join('')}</div>
       <button type="button" class="overview-toggle" id="${cardId}Toggle" data-hidden="${hiddenCount}">展開其餘 ${hiddenCount} 個族群 ▾</button>`
    : '';
  return rows.slice(0, OVERVIEW_TOP_N).join('') + moreRows;
}
function bindOverviewToggle(cardId){
  const toggle = document.getElementById(cardId+'Toggle');
  if(!toggle) return;
  toggle.addEventListener('click', ()=>{
    const expanded = document.getElementById(cardId).classList.toggle('expanded');
    toggle.textContent = expanded ? '收合 ▴' : `展開其餘 ${toggle.dataset.hidden} 個族群 ▾`;
  });
}

// ---------- 離高點 % ----------
function distColor(v){
  if(v===null) return 'var(--text-faint)';
  return v>=-10 ? 'var(--strong)' : v<=-25 ? 'var(--weak)' : 'var(--signal)';
}
function fmtDist(v){ return v===null ? '–' : (v>0?'+':'')+v.toFixed(1)+'%'; }

function groupDistStats(g){
  const vals = g.stocks.map(s=>computeRow(s.code).distPct).filter(v=>v!==null);
  const avg = vals.length ? Math.round(vals.reduce((a,b)=>a+b,0)/vals.length*10)/10 : null;
  return {vals, avg};
}

// 離高點 % 的座標軸下限：取資料最小值往下取整到 10 的倍數，上限固定 0%
function distAxisMin(values){
  const finite = values.filter(v=>v!==null && isFinite(v));
  const min = finite.length ? Math.min(...finite) : -10;
  return Math.min(Math.floor(min/10)*10, -10);
}

// 趨勢圖的 y 軸範圍貼近資料(以 5% 為單位),讓每天的變化看得出來
function renderDistTrendChart(history){
  const vals = (history||[]).map(d=>d.pct);
  let yMin = vals.length ? Math.floor(Math.min(...vals)/5)*5 : -10;
  let yMax = vals.length ? Math.min(Math.ceil(Math.max(...vals)/5)*5, 0) : 0;
  if(yMax - yMin < 10){
    yMax = Math.min(yMax + 5, 0);
    yMin = yMax - 10;
  }
  const step = (yMax - yMin) > 20 ? 10 : 5;
  const ticks = [];
  for(let v = yMax; v >= yMin; v -= step) ticks.push(v);
  return renderGroupTrendChart(history, {
    yMin, yMax, ticks,
    emptyText: '資料不足,無法畫出離高點趨勢',
  });
}


renderBenchmarks();
renderOverview();
renderGroups();
</script>
