name: Daily MA Report

on:
  schedule:
    # UTC 時間 07:05 = 台灣時間 15:05，週一到週五執行
    - cron: '5 7 * * 1-5'
    # 備援：UTC 08:37 = 台灣時間 16:37。GitHub 忙碌時排程可能延遲或被丟掉，
    # 多排一次確保當天有跑到；兩次都跑也只是用同一天的資料重新產生報告
    - cron: '37 8 * * 1-5'
  workflow_dispatch: {}

# 同一時間只跑一個，後到的排隊等前一個跑完，避免兩次同時推送互相衝突
concurrency:
  group: daily-ma-report
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install packages
        run: pip install requests pandas
      - name: run script
        run: python generate_report.py
      - name: copy to docs
        run: |
          mkdir -p docs
          cp output/*.html docs/index.html
      - name: commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html history.json
          git commit -m "update" || echo "no changes"
          git push
