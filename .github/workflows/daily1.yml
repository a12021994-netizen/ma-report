name: Daily MA Report

on:
  schedule:
    - cron: '0 8 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install packages
        run: pip install yfinance requests pandas
      - name: run script
        run: python generate_report.py
      - name: copy to docs
        run: |
          mkdir -p docs
          cp output/*.html docs/index.html
      - name: commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html history.json
          git commit -m "update" || echo "no changes"
          git push
